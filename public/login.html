<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | UniCesumar Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo-row">
        <span class="brand-title">UniCesumar <span class="brand-badge-nexus">NEXUS</span></span>
        <span class="brand-subtitle">SUÍTE DE OPERAÇÕES ACADÊMICAS ENTERPRISE</span>
      </div>

      <form class="login-form" id="login-form">
        <div id="login-error" class="form-error" style="display:none;"></div>
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" placeholder="ex: clodoaldo" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
          <i data-feather="log-in"></i> Entrar na Plataforma
        </button>
      </form>

      <div class="login-demo-accounts">
        <h6>Contas de demonstração (ambiente de avaliação)</h6>
        <div class="demo-account-btn" data-user="clodoaldo" data-pass="Gestor@123">
          <span>Clodoaldo</span><span class="role-tag">Gestor / Admin</span>
        </div>
        <div class="demo-account-btn" data-user="colaborador.admissoes" data-pass="Colab@123">
          <span>Colaborador Admissões</span><span class="role-tag">Admissões Comercial</span>
        </div>
        <div class="demo-account-btn" data-user="tutor.ead" data-pass="Tutor@123">
          <span>Tutor EAD</span><span class="role-tag">Tutoria EAD</span>
        </div>
      </div>

      <p class="login-footer-note">© UniCesumar Nexus — Ambiente de demonstração local</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    (async function () {
      // If already logged in, skip straight to the app.
      try {
        await window.NexusAPI.get('/auth/me');
        location.href = '/index.html';
        return;
      } catch (_) { /* not logged in, stay on this page */ }

      if (window.feather) window.feather.replace();

      document.querySelectorAll('.demo-account-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('username').value = btn.getAttribute('data-user');
          document.getElementById('password').value = btn.getAttribute('data-pass');
        });
      });

      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading-spinner"></span> Entrando...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Falha no login.');
          location.href = '/index.html';
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i data-feather="log-in"></i> Entrar na Plataforma';
          if (window.feather) window.feather.replace();
        }
      });
    })();
  </script>
</body>
</html>
